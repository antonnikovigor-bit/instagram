function fmtPhone(v){let d=String(v||'').replace(/\D/g,'');if(!d)return '+';if(d[0]==='8')d='7'+d.slice(1);
 const g=(s,p)=>{let o=[],i=0;for(const n of p){if(i>=s.length)break;o.push(s.slice(i,i+n));i+=n;}return o.join(' ');};
 if(d[0]==='7'){d=d.slice(0,11);return '+7'+(d.length>1?' '+g(d.slice(1),[3,3,2,2]):'');}

const DOCS={offer:"<h1>Условия участия (оферта)</h1><p>Заполнив анкету и оплатив участие, Участник принимает (акцептует) настоящие условия и Памятку участника в полном объёме.</p><h2>1. Кто и что</h2><ul><li><strong>Организатор</strong>: ИП «ОСНОВА» (Карлик Алёна Григорьевна), ИИН 790217402441, г. Алматы, ул. Новая 2.</li><li><strong>Участник</strong>: физическое лицо, достигшее 18 лет, которое приняло настоящие условия.</li><li><strong>Программа</strong>: в течение 30 дней Участник ежедневно уделяет один час своей цели в одном из ритмов: 5AM, 6AM или MY AM (время подъёма Участник выбирает сам). Ритм Участник выбирает в анкете. В Программу входят бот, чаты, бадди и куратор.</li><li>Программа не является медицинской, психологической или образовательной услугой. Организатор не гарантирует достижения результата: результат зависит от действий Участника.</li></ul><h2>2. Сроки</h2><ul><li>Вступление: до 21:00 по времени г. Алматы 29 ноября 2026 года. После старта Челленджа новые участники не принимаются.</li><li>Подготовительная неделя: 23-29 ноября 2026 года. В этот период Участник получает задания, Цена слова за опоздания и пропуски не «сгорает».</li><li>Челлендж: 30 ноября - 29 декабря 2026 года.</li></ul><h2>3. Деньги</h2><ul><li>При вступлении Участник вносит 75 000 ₸: 25 000 ₸ за участие и 50 000 ₸ Цена слова (залог).</li><li>Оплата производится по ссылке Kaspi Pay из анкеты или по реквизитам, которые предоставляет куратор, до 21:00 29 ноября.</li><li>Внесённые суммы не возвращаются, кроме последней несгоревшей Цены слова (см. ниже). Если Участник оплатил, но не участвует или выходит из Челленджа, Цена слова «сгорает». Особые случаи рассматриваются куратором индивидуально.</li><li>Цена слова «сгорает» в случаях, указанных в Памятке (раздел «Цена слова»). Время определяется по городу, указанному Участником в анкете.</li><li>Если Цена слова «сгорела», Участник вправе восстановить участие: внести новую Цену слова 50 000 ₸ до 21:00 того же дня. Если он не сделал этого в тот же день, он может внести её до 21:00 следующего дня. Если новая Цена слова не внесена и в этот срок, участие прекращается.</li><li>Последняя несгоревшая Цена слова возвращается до 7 января 2027 года на реквизиты, с которых поступила оплата.</li></ul><h2>4. Обязательства</h2><p><strong>Организатор обязуется:</strong></p><ul><li>предоставить Участнику доступ к боту и чатам Челленджа, ежедневные задания, бадди и куратора;</li><li>отвечать на вопросы Участника в течение 24 часов с момента их получения через чат или куратора;</li><li>связаться с Участником в течение 24 часов с момента «сгорания» его Цены слова;</li><li>объявить итоги Челленджа 30 декабря 2026 года;</li><li>вернуть Цену слова в порядке и сроки, указанные в разделе 3.</li></ul><p><strong>Участник обязуется:</strong></p><ul><li>соблюдать правила, изложенные в Памятке;</li><li>указать в анкете достоверные сведения. Ответственность за последствия недостоверных сведений несёт Участник;</li><li>соблюдать выбранное в анкете время подъёма. После старта Челленджа время подъёма не меняется.</li></ul><p>Участник самостоятельно решает, подходят ли ему ранний подъём и физическая нагрузка. При наличии противопоказаний Участнику рекомендуется проконсультироваться с врачом до старта Челленджа. Физическое задание можно заменить по согласованию с куратором.</p><h2>5. Уважительные причины</h2><ul><li>Цена слова не «сгорает» при вызове скорой помощи, госпитализации Участника (при подтверждении факта) или сбое бота. Обычная болезнь уважительной причиной не является.</li><li>При перелёте или смене часового пояса Участник предупреждает куратора за сутки, и время подъёма переводится на местное.</li><li>Если в момент подъёма Участник находится в самолёте, он обязательно присылает скриншот экрана телефона, на котором видны время и дата.</li><li>Решение принимает куратор до конца текущего дня.</li></ul><h2>6. Прочее</h2><ul><li>Данные анкеты используются только для проведения Программы и третьим лицам не передаются. Принимая условия, Участник даёт согласие на обработку своих данных. Имя, отчёты и время отбоя Участника видит его команда, а имя, ежедневный статус (день закрыт или нет) и итог - все участники потока.</li><li>При повторном нарушении правил чатов Участник исключается из чатов.</li><li>После старта Челленджа Организатор может изменять только задания. Стоимость участия и правила Цены слова не меняются.</li><li>Споры решаются путём переговоров, а если договориться не удалось - в соответствии с законодательством Республики Казахстан.</li></ul><h2>7. Реквизиты Организатора</h2><ul><li>ИП «ОСНОВА», Карлик Алёна Григорьевна</li><li>ИИН 790217402441</li><li>АО «Народный Банк Казахстана», ИИК KZ33601A861065502921, БИК HSBKKZKX</li><li>Адрес: г. Алматы, ул. Новая 2</li><li>Телефон: +7 771 779 85 42, e-mail: visaireglobal@gmail.com</li></ul>",rules:"<h1>Памятка участника</h1><p>30 дней, 30 ноября - 29 декабря, ты каждый день отдаёшь час своей цели и отмечаешь это в чате «Райли. Час для себя». Время - по твоему городу.</p><h2>День</h2><table><thead><tr><th>Ритм</th><th>«Проснулся»</th><th>Задание дня</th><th>Отчёт о часе</th></tr></thead><tbody><tr><td>5AM</td><td>04:30-05:09</td><td>до 05:30</td><td>-</td></tr><tr><td>6AM</td><td>04:30-06:09</td><td>до 06:30</td><td>-</td></tr><tr><td>MY AM</td><td>когда проснулся</td><td>до 20:59</td><td>до 21:00</td></tr></tbody></table><ul><li>Задание дня открывается после нажатия кнопки «Проснулся». Нажатие в 05:10 (5AM) или в 06:10 (6AM) - уже опоздание.</li><li>Отчёт о часе (только MY AM) - до 21:00: напиши, что делал этот час - читал, бегал, медитировал. Подтверждение не нужно, это на твоём честном слове.</li><li>Ритм после старта не меняется.</li></ul><h2>Подготовительная неделя, 23-29 ноября</h2><ul><li>Задания приходят, цена слова за опоздания не сгорает - можно войти в ритм без риска.</li><li>23-26 ноября идём тремя общими группами - 5AM, 6AM и MY AM.</li><li>27 ноября куратор собирает десятки и пары бадди. 28-29 ноября - пробные дни уже в десятках.</li><li>Оплатил позже - куратор добавит тебя в десятку. Хочешь в другую десятку - напиши куратору до 29 ноября, 21:00. После этого составы не меняются.</li><li>Можно сразу вставать в своё время или сдвигать подъём на 15-20 минут в день.</li><li>Чтобы восстановиться, спи 7-8 часов. В задании дня пиши, во сколько лёг и во сколько встал - так посчитаем, кто сколько спал.</li></ul><h2>Цена слова</h2><p>Сгорает в четырёх случаях:</p><ol><li>5AM и 6AM: «Проснулся» позже 05:10 / 06:10 или не нажат.</li><li>5AM и 6AM: задание дня не сдано до 05:30 / 06:30. MY AM: до 20:59.</li><li>MY AM: отчёт о часе не сдан до 21:00.</li><li>Заявил о выходе из челленджа.</li></ol><p>Если сгорела:</p><ul><li>Вносишь новые 50 000 ₸ до 21:00 того же дня - со следующего дня идёшь дальше.</li><li>Не успел - можно внести до 21:00 следующего дня и закрыть этот день. Балл за пропущенный день не вернётся.</li><li>Не внёс и тогда - вылет из челленджа.</li></ul><p>Дошёл до конца - последняя цена слова вернётся до 7 января.</p><p>Перелёт - предупреди куратора за сутки. Простуда - не форс-мажор. Госпитализация - пиши куратору: при подтверждении цена слова не сгорит, а ❌ в итоге дня исправим на ✅.</p><h2>Баллы</h2><ul><li>Личный балл: 1 в день, если день закрыт вовремя (5AM и 6AM - подъём и задание, MY AM - задание и отчёт о часе). Максимум 30.</li><li>Твой бадди проспал - балл за этот день не получает ни он, ни ты. В итоге дня у тебя при этом ✅.</li><li>Балл десятки = средний балл её участников: закрыли 8 из 10 - десятка получает 0,8. Максимум 30, как у тебя. Состав десятки фиксируется 29 ноября в 21:00, выбывший остаётся в нём с нулём.</li><li>«Все в строю» - день закрыли все в десятке. При равенстве баллов выше та, у кого больше таких дней.</li><li>Десятки соревнуются внутри своего ритма: 5AM с 5AM, 6AM с 6AM, MY AM с MY AM.</li><li>Итоги 30 декабря: лучшая десятка каждого ритма и личные статусы - «30 из 30» (все дни закрыты), «Слово сдержано» (цена слова ни разу не сгорала), «Дошёл до финиша» (прошёл все 30 дней).</li></ul><h2>Бадди</h2><p>Напарник из твоей десятки, при нечётном числе - тройка. Знает твою цель, по понедельникам смотрит твои 3 шага на неделю, по субботам - сколько сделано. Утром видит, проснулся ли ты, и пишет или звонит, если нет. Пропал больше чем на сутки - сообщит куратору. Напарник выбыл - идёшь сам, пока не появится свободный участник. Бадди не начальник и не тренер.</p><h2>Куратор - Алёна, @AlyonaK89</h2><p>Отвечает на вопросы, решает форс-мажоры и споры в течение суток, принимает оплату и возвращает цену слова. Выпал из ритма - свяжется и поможет вернуться.</p><h2>Чаты</h2><ul><li>Два чата: общий - для всего потока, и чат твоей десятки.</li><li>Общий чат: задание дня, «Проснулся», отчёты всех участников, итог дня и баллы десяток (5AM и 6AM - в 09:30, MY AM - в 21:30), объявления куратора. Итог дня - поимённо весь поток по десяткам: ✅ день закрыт, ❌ не закрыт, 🔥 вернулся после срыва. Твой статус каждый день видит весь поток. Ошибается тот, кто что-то делает: важно не упасть, а вернуться.</li><li>Чат десятки: разговоры команды - поддержка, кто сегодня выпал, план, как обогнать другие десятки.</li><li>Тишина с 22:00 до 04:30.</li><li>Поддерживаем действие, не оцениваем человека. Без советов без спроса, рекламы, политики и религии.</li><li>Скриншоты и фото людей - только с их согласия. Конфликт - в личку или куратору.</li><li>Повторное нарушение - удаление из чата.</li></ul>"};

     <p>Я выбираю прожить этот месяц осознанно - не откладывать, а делать.</p>
     <div class="row"><span>Моя цель</span><span>${esc(S.b)}</span></div>
     <div class="row"><span>Мой ритм</span><span>${esc(S.rhythm)}${S.city?' · '+esc(S.city):''}</span></div>
     <div class="row"><span>Цена слова</span><span>50 000 ₸</span></div>
     <p>Я делаю это, чтобы стать сильнее, спокойнее и счастливее - для себя и для тех, кто рядом.</p>
     <p class="from">${esc(S.name)} · ${d}</p>
   </div>`;}},
 {k:'sent',render:()=>`<div class="sent">${S.next===NEXT_Q?'<h1>Записали</h1>':S.paid?'<h1>Спасибо!</h1>':'<h1>Слово<br><em>принято</em></h1>'}
   <p class="lead">${firstName()?esc(firstName())+', а':'А'}нкета у нас. ${S.next===NEXT_Q?'Куратор напишет в WhatsApp в течение суток и ответит на вопросы. Решение - после разговора, вход до 29 ноября, 21:00.':(S.paid?'Куратор проверит поступление оплаты и свяжется с тобой в WhatsApp, чтобы добавить в группу.':'Последний шаг - оплата:')}</p>
   ${S.next===NEXT_Q?'':'<a class="btn pay-k kaspi" href="https://pay.kaspi.kz/pay/aropqjkb" target="_blank" rel="noopener">Оплатить 75 000 ₸ в Kaspi</a>'+(S.paid?'<p class="note">Если оплата не прошла, кнопка выше по-прежнему работает. Сумма - 75 000 ₸.</p>':'<p class="note">Сумму 75 000 ₸ введи сам(а). После оплаты вернись сюда и нажми «Я оплатил(а)».</p><button type="button" class="btn ghost pay-k" data-act="paid">Я оплатил(а)</button>')}
   ${S.next===NEXT_Q||S.paid?'':`<ol class="next"><li>Оплата - до 29 ноября, 21:00</li><li>С 23 ноября - подготовительная неделя: задания идут, цена слова не сгорает</li><li>Куратор добавит тебя в чат твоего ритма, 27 ноября - в десятку с бадди</li><li>29 ноября - установочная встреча онлайн, ссылку пришлём</li><li>30 ноября - первый день</li></ol>`}
   ${SENDER?'':'<p class="note">Тестовый просмотр: в этой версии ответ никуда не отправлен.</p>'}</div>`}
];
const API='https://script.google.com/macros/s/AKfycbwV5CZZ-z2IgfvqsQ5axBqlpbpxgEdy1QLVK2zrlYQr-NRq7q43O2JjDMXpP8vMGys5/exec';
function apiCall(fn,arg,ok,fail){fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,arg:arg})}).then(r=>r.json()).then(j=>{if(j&&j.ok){if(ok)ok(j);}else if(fail)fail(j);}).catch(e=>{if(fail)fail(e);});}
const SENDER={_ok:null,_f:null,withSuccessHandler(f){this._ok=f;return this;},withFailureHandler(f){this._f=f;return this;},submit(d){const o=this._ok,f=this._f;this._ok=this._f=null;apiCall('submit',d,j=>{try{fbq('track','Lead',{content_name:d&&d.next||''});}catch(e){}if(o)o(j);},f);},markPaid(p){try{fbq('trackCustom','PaidClaim');}catch(e){}apiCall('markPaid',p);}};
/* Новые поля - в конце строки, чтобы старые колонки таблицы не съехали */
function payload(){const r={src:SHORT?'1':'',name:S.name,phone:S.phone,insta:S.insta,sphere:(sph(S.sphere)||{}).name||'',a:S.a,b:S.b,why:S.why.concat(S.whyOwn?[S.whyOwn]:[]).join(', '),reward:S.reward,rhythm:S.rhythm,agree:S.agree.every(Boolean)?'Да':'Нет',
  city:S.city,next:S.next===NEXT_Q?'❓ Вопросы':'💳 К оплате',question:S.next===NEXT_Q?S.question:'',offer:S.agree[0]?'Да':'Нет',pd:S.agree[1]?'Да':'Нет',ritual:S.ritual};
  SPHERES.forEach(x=>{r['d_'+x.id]=S.delay[x.id]||'';r['ago_'+x.id]=S.ago[x.id]||'';});return r;}
const main=document.getElementById('main'),next=document.getElementById('next'),back=document.getElementById('back'),bar=document.querySelector('.bar');
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
const idx=k=>STEPS.findIndex(x=>x.k===k);
function render(keep){
  const st=STEPS[S.step];if(!keep&&st.enter)st.enter();
  main.innerHTML=st.render();document.getElementById('err').textContent='';
  const total=idx('review');
  document.getElementById('count').textContent=S.step===0||st.k==='sent'?'':`${Math.min(S.step,total)} / ${total}`;
  document.getElementById('rail').style.width=(Math.min(S.step,total)/total*100)+'%';
  bar.hidden=st.k==='sent';
  back.hidden=S.step===0;
  next.disabled=false;
  next.textContent=S.step===0?'Записаться':st.k==='review'?'Заявляю':st.k==='next'&&S.next===NEXT_Q?'Отправить':st.k==='price'?'Дать слово':'Дальше';
  if(!keep)window.scrollTo(0,0);
}
main.addEventListener('click',e=>{
  const st=STEPS[S.step],t=e.target.closest('button');if(!t)return;
  if(t.dataset.fill){const f=document.getElementById(t.dataset.fill);f.value=t.dataset.v;f.focus();return;}
  if(t.dataset.act==='paid'){S.paid=true;save();render();if(SENDER)SENDER.markPaid(S.phone);return;}
  const g=t.parentElement.dataset.group;
  if(g&&st.pick){if(st.read)st.read();st.pick(g,t.dataset.v);save();render(true);}
});
next.addEventListener('click',()=>{
  const st=STEPS[S.step];
  if(st.k==='next'){if(st.read)st.read();const m0=st.check();if(m0){document.getElementById('err').textContent=m0;save();return;}}
  if(st.k==='review'||(st.k==='next'&&S.next===NEXT_Q)){
    const err=document.getElementById('err'),lbl=st.k==='review'?'Заявляю':'Отправить';
    if(!SENDER){S.step=idx('sent');render();return;}
    next.disabled=true;next.textContent='Отправляю...';err.textContent='';
    SENDER.withSuccessHandler(()=>{S.sent=true;S.step=idx('sent');save();render();})
      .withFailureHandler(()=>{next.disabled=false;next.textContent=lbl;err.textContent='Не отправилось. Проверь интернет и нажми «Отправить» ещё раз.';})
      .submit(payload());
    return;
  }
  if(st.read)st.read();
  const m=st.check?st.check():'';
  if(m){document.getElementById('err').textContent=m;save();return;}
  do{S.step++;}while(S.step<STEPS.length-1&&skip(STEPS[S.step].k));save();render();
});
back.addEventListener('click',()=>{const st=STEPS[S.step];if(st.read)st.read();do{S.step=Math.max(0,S.step-1);}while(S.step>0&&skip(STEPS[S.step].k));save();render();});
if(!(S.step>=0&&S.step<STEPS.length))S.step=0;
while(S.step<STEPS.length-1&&skip(STEPS[S.step].k))S.step++;
if(S.sent)S.step=idx('sent');
render();
</script>
</body></html>
