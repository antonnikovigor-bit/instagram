name: Сбор статистики Instagram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Полный сбор (дни + аудитория)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Действия закреплены по хэшу коммита: их нельзя незаметно подменить
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Забрать ветку с данными
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data --single-branch "$REMOTE" data
          else
            mkdir data && cd data && git init -b data && git remote add origin "$REMOTE"
          fi

      - name: Собрать данные
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FULL: ${{ github.event.inputs.full || 'false' }}
          DATA_DIR: data
        run: node scripts/collect.mjs

      - name: Сохранить
        run: |
          cd data
          git config user.name "insta-stats-bot"
          git config user.email "insta-stats-bot@users.noreply.github.com"
          # Держим в ветке один коммит, чтобы репозиторий не разрастался
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin snapshot:data
